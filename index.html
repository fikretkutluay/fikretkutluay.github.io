<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Fikret Kutluay — Game Developer</title>
    <meta name="description" content="Fikret Kutluay — Game Developer & Software Engineer. Unity, C#, AI automation.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <a href="index.html" class="brand">Fikret Kutluay</a>

        <nav class="nav-desktop">
            <ul class="nav-links">
                <li><a href="#portfolio" data-i18n="nav_portfolio">Portfolio</a></li>
                <li><a href="#about" data-i18n="nav_about">About</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn lang-tr-btn">TR</button>
                <span class="lang-divider">/</span>
                <button class="lang-btn lang-en-btn">EN</button>
            </div>
        </nav>

        <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="mobile-nav" id="mobile-nav">
        <ul class="mobile-links">
            <li><a href="#portfolio" data-i18n="nav_portfolio" class="mobile-link">Portfolio</a></li>
            <li><a href="#about" data-i18n="nav_about" class="mobile-link">About</a></li>
        </ul>
        <div class="lang-switch">
            <button class="lang-btn lang-tr-btn">TR</button>
            <span class="lang-divider">/</span>
            <button class="lang-btn lang-en-btn">EN</button>
        </div>
    </div>

    <main>
        <!-- Hero band: oversized centred name, rule, role -->
        <section id="hero" class="hero band">
            <img src="character.svg" alt="" class="pixel-char" width="32" height="43">
            <h1 class="hero-name" data-i18n="hero_title">Fikret Kutluay</h1>
            <div class="rule"></div>
            <p class="hero-role" data-i18n="hero_subtitle">Game Developer</p>
        </section>

        <!-- Portfolio: category cards -> subpages -->
        <section id="portfolio" class="section section-centred">
            <div class="col">
                <div class="page-head">
                    <h2 class="page-title" data-i18n="portfolio_title">Portfolio</h2>
                    <div class="rule"></div>
                    <p class="page-sub" data-i18n="portfolio_sub"></p>

                    <ul class="profile-links">
                        <li><a href="https://github.com/fikretkutluay" target="_blank" rel="noopener">GitHub</a></li>
                        <li><a href="https://fikretkutluay.itch.io" target="_blank" rel="noopener">itch.io</a></li>
                        <li><a href="https://www.linkedin.com/in/fikret-kutluay-/" target="_blank"
                                rel="noopener">LinkedIn</a></li>
                        <li class="mail-item">
                            <a href="mailto:kutluayfikret17@gmail.com" id="mail-link">kutluayfikret17@gmail.com</a>
                            <button type="button" class="copy-btn" id="copy-mail" data-mail="kutluayfikret17@gmail.com"
                                data-i18n="btn_copy">Copy</button>
                        </li>
                    </ul>
                </div>

                <div class="cat-cards" id="category-cards"></div>
            </div>
        </section>

        <!-- About band: two columns of prose, centred container -->
        <section id="about" class="section band section-centred">
            <div class="col">
                <div class="page-head">
                    <h2 class="page-title" data-i18n="about_title">About</h2>
                    <div class="rule"></div>
                </div>
                <div class="about-text">
                    <p data-i18n="about_p1"></p>
                    <p data-i18n="about_p2"></p>
                    <p data-i18n="about_p3"></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="col">
            <p data-i18n="footer_text">© Fikret Kutluay</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
